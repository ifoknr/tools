<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IFOKNR Root Modules</title>
<meta name="description" content="NextZygisk, NextWheel, NextSUSFS and NextCore: root hiding at every layer, and steady performance.">
<meta name="theme-color" content="#07070a">
<link rel="icon" href="img/nextzygisk.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sky" aria-hidden="true"><i class="pl p1"></i><i class="pl p2"></i><i class="pl p3"></i><i class="pl p4"></i></div>

<header class="wrap top">
  <nav class="bar">
    <a class="brand" href="#"><img class="signame" src="img/ifoknr-name.svg" alt="IFOKNR"></a>
    <span class="links"><a href="#mods" data-t="n1"></a><a href="#stack" data-t="n2"></a><a href="#join" data-t="n3"></a></span>
    <span class="end"><button class="lang" type="button" data-act="lang" data-t="lang"></button><a class="out sm" href="#join"><span data-t="group"></span> ›</a></span>
  </nav>
</header>

<main>
  <section class="wrap hero">
    <span class="tag" data-t="tag"></span>
    <h1><span class="grad" data-t="h1a"></span> <span class="grad2 swoosh" data-t="h1b"></span></h1>
    <p class="lead" data-t="lead"></p>
    <div class="cta"><a class="out" href="#join" data-t="group"></a><a class="fill" href="#mods" data-t="browse"></a></div>

    <div class="orbit" aria-hidden="true">
      <i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i><i class="glow"></i>
      <img class="core name" src="img/ifoknr-name.svg" alt="IFOKNR">
      <span class="sat tool s1"><img src="img/nextzygisk.svg" alt=""></span>
      <span class="sat tool s2"><img src="img/nextsusfs.svg" alt=""></span>
      <span class="sat tool s3"><img src="img/nextwheel.svg" alt=""></span>
      <span class="sat tool s4"><img src="img/nextcore.svg" alt=""></span>
      <div class="chip c1"><b class="ci ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></b><span><small>NextZygisk</small><em data-t="c1"></em></span></div>
      <div class="chip c2"><b class="ci"><svg viewBox="0 0 24 24"><path d="M7 4h10v16H7zM4 8h3M4 12h3M4 16h3M17 8h3M17 12h3M17 16h3"/></svg></b><span><small>NextSUSFS</small><em data-t="c2"></em></span></div>
      <div class="chip c3"><b class="ci ok"><svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6z"/></svg></b><span><small>NextWheel</small><em data-t="c3"></em></span></div>
      <div class="chip c4"><b class="ci"><svg viewBox="0 0 24 24"><path d="M13 3 5 13h6l-1 8 8-10h-6z"/></svg></b><span><small>NextCore</small><em data-t="c4"></em></span></div>
    </div>
  </section>

  <section class="wrap sec" id="mods">
    <span class="tag" data-t="m_tag"></span>
    <h2><span data-t="m_h1"></span> <span class="grad2" data-t="m_h2"></span></h2>
    <p class="sub" data-t="m_d"></p>
    <div class="notches mods" id="cards"></div>
  </section>

  <section class="wrap sec" id="stack">
    <span class="tag" data-t="s_tag"></span>
    <h2><span data-t="s_h1"></span> <span class="grad2">NEXT</span></h2>
    <p class="sub" data-t="s_d"></p>
    <div class="panels" id="panels"></div>
  </section>

  <section class="wrap sec" id="numbers">
    <span class="tag" data-t="d_tag"></span>
    <h2><span data-t="d_h1"></span> <span class="grad2" data-t="d_h2"></span></h2>
    <p class="sub" data-t="d_d"></p>
    <div id="dash"></div>
  </section>

  <section class="wrap sec final" id="join">
    <i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i>
    <h2><span data-t="j_h1"></span><br><span class="swoosh" data-t="j_h2"></span></h2>
    <p class="sub" data-t="j_d"></p>
    <div class="cta"><a class="fill" href="https://t.me/BeNeXTBrO" target="_blank" rel="noopener" data-t="group"></a><a class="out" href="https://github.com/ifoknr" target="_blank" rel="noopener">GitHub</a></div>
  </section>
</main>

<footer class="wrap foot">
  <a class="brand" href="#"><img class="signame" src="img/ifoknr-name.svg" alt="IFOKNR"></a>
  <span class="flinks"><a href="#mods" data-t="n1"></a><a href="#stack" data-t="n2"></a><a href="#join" data-t="n3"></a><a href="/fastbootstudio/">Fastboot Studio</a><a href="/" data-t="to_home"></a></span>
  <span class="fine" data-t="fine"></span>
</footer>
<script src="app.js"></script>
</body>
</html>
