name: Bot

# Tests the Telegram bot and publishes it to ghcr.io/ifoknr/tools-bot.
on:
  push:
    branches: [main]
    paths: ["bot/**", "site/assets/tools.json", ".github/workflows/bot.yml"]
  pull_request:
    paths: ["bot/**", "site/assets/tools.json", ".github/workflows/bot.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tests
        working-directory: bot
        run: |
          pip install -r requirements-dev.txt
          cp ../site/assets/tools.json ifoknr_bot/tools.json
          python -m pytest -v

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and start
        run: |
          docker build -f bot/Dockerfile -t bot:test .
          # Without a token it must stop with a clear message, not a traceback.
          out=$(docker run --rm bot:test 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "BOT_TOKEN is not set"

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bot/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tools-bot:latest
            ghcr.io/${{ github.repository_owner }}/tools-bot:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=IFOKNR tools Telegram bot
