<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Roboto; src: url(Roboto-Regular.ttf); font-weight: 400; }
@font-face { font-family: Roboto; src: url(Roboto-Medium.ttf); font-weight: 500; }
@font-face { font-family: Roboto; src: url(Roboto-Bold.ttf); font-weight: 700; }

:root { --k: 1; }
html { font-size: calc(var(--k) * 16px); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1300px; height: 860px; overflow: hidden; }
body { font-family: Roboto, Kufi, sans-serif; background: #050407; display: flex; align-items: center; justify-content: center; font-size: .8125rem; }
body.ar { font-family: Kufi, Roboto, sans-serif; }
.mono { font-family: 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace; direction: ltr; unicode-bidi: isolate; }
.win { width: 1220px; height: 780px; border-radius: 12px; overflow: hidden; background: var(--surface); color: var(--onSurface);
  box-shadow: 0 24px 60px rgba(0,0,0,.45), 0 0 0 1px var(--outlineVariant); display: flex; flex-direction: column; }
.titlebar { height: 34px; flex: none; display: flex; align-items: center; padding: 0 14px; font-size: .72rem; color: var(--onSurfaceVariant); background: var(--surfaceContainerLow); }
.titlebar .sp { flex: 1; } .titlebar .cap { width: 40px; text-align: center; font-size: .8rem; }
.body { flex: 1; display: flex; min-height: 0; }
.drawer { width: 220px; flex: none; background: var(--surfaceContainerLow); padding: 6px 10px 10px; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 12px; }
.brand img { width: 34px; height: 34px; border-radius: 10px; }
.brand b { display: block; font-family: Prixma, Roboto, sans-serif; font-style: italic; font-weight: 700; font-size: .9rem; letter-spacing: .2px; direction: ltr; }
.brand span { font-size: .7rem; color: var(--onSurfaceVariant); }
.section { font-size: .7rem; color: var(--onSurfaceVariant); padding: 9px 14px 4px; font-weight: 500; }
.nav { height: 36px; border-radius: 18px; display: flex; align-items: center; gap: 11px; padding: 0 14px; font-size: .8125rem; font-weight: 500; color: var(--onSurfaceVariant); margin-bottom: 1px; }
.nav svg { width: 19px; height: 19px; flex: none; }
.nav.on { background: var(--secondaryContainer); color: var(--onSecondaryContainer); }
.nav .badge { margin-inline-start: auto; background: var(--primary); color: var(--onPrimary); font-size: .62rem; border-radius: 8px; padding: 0 6px; height: 15px; line-height: 15px; }
.drawer .foot { margin-top: auto; }
.devchip { display: flex; align-items: center; gap: 9px; padding: 9px 13px; border-radius: 14px; background: var(--surfaceContainerHigh); font-size: .75rem; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 25%, transparent); flex: none; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
.appbar { display: flex; align-items: center; gap: 10px; padding: 16px 22px 12px; flex: none; }
.appbar h1 { font-size: 1.375rem; font-weight: 400; line-height: 1.2; }
.ar .appbar h1 { font-weight: 500; font-size: 1.3rem; }
.appbar p { font-size: .78rem; color: var(--onSurfaceVariant); margin-top: 2px; }
.appbar .sp { flex: 1; }
.btn { height: 34px; border-radius: 17px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-size: .8125rem; font-weight: 500; white-space: nowrap; border: none; background: transparent; color: var(--onSurface); font-family: inherit; }
.btn svg { width: 16px; height: 16px; }
.filled { background: var(--primary); color: var(--onPrimary); }
.tonal { background: var(--secondaryContainer); color: var(--onSecondaryContainer); }
.outlined { border: 1px solid var(--outline); color: var(--primary); }
.text { color: var(--primary); padding: 0 10px; }
.errorbtn { background: var(--errorContainer); color: var(--onErrorContainer); }
.icon-btn { width: 34px; height: 34px; border-radius: 17px; display: inline-flex; align-items: center; justify-content: center; background: var(--surfaceContainerHighest); color: var(--onSurfaceVariant); font-weight: 700; font-size: .95rem; flex: none; }
.content { flex: 1; display: grid; gap: 14px; padding: 0 22px 18px; min-height: 0; }
.col { display: flex; flex-direction: column; gap: 14px; min-height: 0; min-width: 0; }
.row2 { display: flex; gap: 14px; }
.card { border-radius: 16px; padding: 14px 16px; background: var(--surfaceContainer); min-width: 0; }
.card.low { background: var(--surfaceContainerLow); }
.card.outl { background: var(--surface); border: 1px solid var(--outlineVariant); }
.card.high { background: var(--surfaceContainerHigh); }
.card h3 { font-size: .9375rem; font-weight: 500; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.card h3 .sp { flex: 1; }
.card h3 small { font-size: .72rem; color: var(--onSurfaceVariant); font-weight: 400; }
.kv { display: grid; grid-template-columns: 128px 1fr; row-gap: 7px; font-size: .8125rem; }
.kv > span:nth-child(odd) { color: var(--onSurfaceVariant); }
.kv > span:nth-child(even) { font-weight: 500; }
.chip { height: 24px; border-radius: 8px; padding: 0 9px; display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 500; border: 1px solid var(--outlineVariant); color: var(--onSurfaceVariant); white-space: nowrap; }
.chip.ok { border: none; background: var(--primaryContainer); color: var(--onPrimaryContainer); }
.chip.sel { border: none; background: var(--secondaryContainer); color: var(--onSecondaryContainer); }
.chip.warn { border: none; background: var(--tertiaryContainer); color: var(--onTertiaryContainer); }
.chip.bad { border: none; background: var(--errorContainer); color: var(--onErrorContainer); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { min-width: 70px; height: 24px; padding: 0 8px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: .72rem; font-weight: 700; background: var(--tertiaryContainer); color: var(--onTertiaryContainer); }
.banner { border-radius: 12px; padding: 10px 12px; background: var(--primaryContainer); color: var(--onPrimaryContainer); display: flex; gap: 10px; align-items: flex-start; font-size: .78rem; line-height: 1.45; }
.banner b { display: block; font-size: .8125rem; margin-bottom: 1px; }
.banner svg { width: 19px; height: 19px; flex: none; margin-top: 1px; }
.banner.warn { background: var(--tertiaryContainer); color: var(--onTertiaryContainer); }
.banner.bad { background: var(--errorContainer); color: var(--onErrorContainer); }
.li { display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: .8125rem; border-radius: 12px; padding: 0 10px; margin-bottom: 4px; }
.li.on { background: color-mix(in srgb, var(--secondaryContainer) 70%, transparent); }
.li .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .s { color: var(--onSurfaceVariant); font-size: .75rem; }
.cb { width: 16px; height: 16px; border-radius: 3px; border: 2px solid var(--onSurfaceVariant); flex: none; display: flex; align-items: center; justify-content: center; }
.cb.on { background: var(--primary); border-color: var(--primary); }
.cb.on::after { content: ''; width: 8px; height: 4px; border-left: 2px solid var(--onPrimary); border-bottom: 2px solid var(--onPrimary); transform: rotate(-45deg) translate(1px, -1px); }
.seg { display: inline-flex; border: 1px solid var(--outline); border-radius: 17px; overflow: hidden; height: 32px; }
.seg span { padding: 0 14px; display: flex; align-items: center; gap: 5px; font-size: .78rem; font-weight: 500; border-inline-start: 1px solid var(--outline); white-space: nowrap; }
.seg span:first-child { border-inline-start: none; }
.seg span.on { background: var(--secondaryContainer); color: var(--onSecondaryContainer); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--outlineVariant); margin: 0 22px 12px; flex: none; }
.tabs span { padding: 9px 14px 10px; font-size: .8125rem; font-weight: 500; color: var(--onSurfaceVariant); position: relative; }
.tabs span.on { color: var(--primary); }
.tabs span.on::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--primary); }
.progress { height: 4px; border-radius: 2px; position: relative; margin: 6px 0 4px; background: var(--secondaryContainer); }
.progress i { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 2px; background: var(--primary); }
.note { font-size: .75rem; color: var(--onSurfaceVariant); line-height: 1.45; }
.grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }
.grid2 .btn, .col > .btn { min-width: 0; padding: 0 10px; overflow: hidden; text-overflow: ellipsis; }
.card { overflow: hidden; }
.switch { width: 46px; height: 28px; border-radius: 14px; background: var(--primary); position: relative; flex: none; }
.switch::after { content: ''; position: absolute; top: 4px; inset-inline-end: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--onPrimary); }
.switch.off { background: var(--surfaceContainerHighest); border: 2px solid var(--outline); }
.switch.off::after { inset-inline-end: auto; inset-inline-start: 5px; top: 5px; width: 14px; height: 14px; background: var(--outline); }
.table { width: 100%; border-collapse: separate; border-spacing: 0 4px; font-size: .78rem; }
.table td, .table th { height: 31px; padding: 0 8px; text-align: start; white-space: nowrap; }
.table th { border-bottom: 1px solid var(--outlineVariant); }
.table td:first-child { border-start-start-radius: 10px; border-end-start-radius: 10px; }
.table td:last-child { border-start-end-radius: 10px; border-end-end-radius: 10px; }
.table th { color: var(--onSurfaceVariant); font-weight: 500; font-size: .72rem; }
.table tr.on td { background: color-mix(in srgb, var(--secondaryContainer) 45%, transparent); }
.avatar { width: 38px; height: 38px; border-radius: 19px; background: var(--primaryContainer); color: var(--onPrimaryContainer); display: flex; align-items: center; justify-content: center; flex: none; }
.avatar svg { width: 20px; height: 20px; }
.stat { flex: 1; border-radius: 14px; padding: 11px 14px; background: var(--surfaceContainerHigh); min-width: 0; }
.stat small { font-size: .7rem; color: var(--onSurfaceVariant); }
.stat b { display: block; font-size: 1.2rem; font-weight: 400; margin-top: 3px; direction: ltr; text-align: start; }
.ar .stat b { text-align: right; }
.field { height: 38px; border-radius: 6px; border: 1px solid var(--outline); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: .8125rem; color: var(--onSurfaceVariant); }
.field.filled-f { border: none; border-bottom: 1px solid var(--onSurfaceVariant); border-radius: 6px 6px 0 0; background: var(--surfaceContainerHighest); }
.drop { border: 2px dashed var(--outlineVariant); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--onSurfaceVariant); }
.drop .avatar { width: 52px; height: 52px; border-radius: 16px; }
.stepper { display: flex; gap: 10px; }
.step { flex: 1; display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 14px; background: var(--surfaceContainer); }
.step .num { width: 26px; height: 26px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .78rem; background: var(--surfaceContainerHighest); flex: none; }
.step.done .num { background: var(--primary); color: var(--onPrimary); }
.step.now { outline: 2px solid var(--primary); }
.step.now .num { background: var(--primaryContainer); color: var(--onPrimaryContainer); }
.step b { display: block; font-size: .8125rem; font-weight: 500; }
.step span { font-size: .72rem; color: var(--onSurfaceVariant); }
.term { background: #0b0a0e; border-radius: 14px; padding: 12px 14px; font-size: .75rem; line-height: 1.7; color: #d8d3de; flex: 1; overflow: hidden; }
.term .p { color: var(--primary); }
.term .ok { color: #8fd9a8; }
.term .d { color: #8b8794; }
.log { font-size: .72rem; line-height: 1.85; }
.log .lv { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-inline-end: 8px; vertical-align: middle; }
.swatch { width: 34px; height: 34px; border-radius: 17px; display: inline-flex; align-items: center; justify-content: center; }
.swatch.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--onSurface); }
.setrow { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--outlineVariant); }
.setrow:last-child { border-bottom: none; }
.setrow .lbl { flex: 1; min-width: 0; }
.setrow .lbl b { display: block; font-size: .8125rem; font-weight: 500; }
.setrow .lbl span { font-size: .72rem; color: var(--onSurfaceVariant); }
.bar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; gap: 2px; }
.bar i { display: block; height: 100%; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .72rem; color: var(--onSurfaceVariant); margin-top: 8px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-inline-end: 5px; vertical-align: middle; }
/* About */
.hero { position: relative; border-radius: 22px; padding: 22px 24px; overflow: hidden; display: flex; align-items: center; gap: 20px;
  background: linear-gradient(120deg, var(--primaryContainer), color-mix(in srgb, var(--tertiaryContainer) 85%, var(--surface)) 70%, var(--surfaceContainerHigh)); color: var(--onPrimaryContainer); }
.hero img { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.hero h2 { font-family: Prixma, Roboto, sans-serif; font-style: italic; font-size: 1.45rem; font-weight: 700; letter-spacing: .1px; direction: ltr; }
.ar .hero h2 { text-align: right; }
.hero p { font-size: .8125rem; opacity: .85; margin-top: 4px; }
.hero .chips { margin-top: 10px; }
.hero .chip { border-color: color-mix(in srgb, var(--onPrimaryContainer) 35%, transparent); color: var(--onPrimaryContainer); }
.hero::after { content: ''; position: absolute; inset-inline-end: -60px; top: -80px; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--primary) 30%, transparent), transparent 65%); }
.dev { display: flex; align-items: center; gap: 16px; }
.mono-av { width: 64px; height: 64px; border-radius: 20px; background: var(--primary); color: var(--onPrimary); display: flex; align-items: center; justify-content: center; font-size: 1.45rem; font-weight: 700; letter-spacing: .5px; flex: none; }
.wordmark { font-size: 1.7rem; font-weight: 700; letter-spacing: 3px; line-height: 1; }
.wordmark + span { font-size: .75rem; color: var(--onSurfaceVariant); }
.sigmark { width: 52px; height: 52px; border-radius: 16px; flex: none; display: flex; align-items: center; justify-content: center; overflow: hidden;
  background: linear-gradient(135deg, var(--primaryContainer), #2a2346); box-shadow: 0 8px 22px rgba(0,0,0,.35), inset 0 0 0 1px color-mix(in srgb, var(--primary) 35%, transparent); }
.sigmark span { font-family: Sig; font-size: 1.35rem; line-height: 1; padding-top: 2px; padding-right: 0; filter: drop-shadow(0 0 .5px #f3eeff) drop-shadow(0 0 .5px #f3eeff); direction: ltr;
  background: linear-gradient(135deg, #f3eeff, var(--primary) 55%, var(--tertiary)); -webkit-background-clip: text; color: transparent; }
.signame { font-family: Sig; font-size: 1.55rem; line-height: 1.2; letter-spacing: .5px; direction: ltr; padding: 4px 6px 0 0;
  background: linear-gradient(100deg, #f3eeff, var(--primary) 50%, var(--tertiary)); -webkit-background-clip: text; color: transparent; filter: drop-shadow(0 0 .4px #f3eeff) drop-shadow(0 0 .4px #f3eeff); }
.ar .signame { text-align: right; }
.swoosh { display: block; width: 135px; height: 8px; margin-top: -2px; }
.ar .swoosh { margin-inline-start: auto; transform: scaleX(-1); }
.role { font-size: .75rem; color: var(--onSurfaceVariant); display: block; margin-top: 2px; }
.sig { height: 4px; width: 120px; border-radius: 2px; margin-top: 8px; background: linear-gradient(90deg, var(--primary), var(--tertiary)); }
.linkrow { display: flex; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 12px; }
.linkrow .ic { width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: var(--secondaryContainer); color: var(--onSecondaryContainer); flex: none; }
.linkrow .ic svg { width: 17px; height: 17px; }
.linkrow b { display: block; font-size: .8125rem; font-weight: 500; }
.linkrow span { font-size: .72rem; color: var(--onSurfaceVariant); }
.linkrow .go { margin-inline-start: auto; color: var(--onSurfaceVariant); font-size: .9rem; }
.ar .linkrow .go { transform: scaleX(-1); }

/* ===== Material 3 Expressive (the XGram look): muted grey surfaces, blue / mauve / slate tonal tiles, big rounded shapes ===== */
.win { border-radius: 18px; }

/* Quick-access tiles: big number on a coloured tile */

.stat:nth-child(4n+1) { background: var(--primaryContainer); color: var(--onPrimaryContainer); }
.stat:nth-child(4n+2) { background: var(--tertiaryContainer); color: var(--onTertiaryContainer); }
.stat:nth-child(4n+4) { background: var(--tertiaryContainer); color: var(--onTertiaryContainer); }
.stat b { order: 0; font-size: 1.2rem; font-weight: 500; margin: 0 0 1px; line-height: 1.2; white-space: nowrap; }

.tabs span.on { background: var(--secondaryContainer); color: var(--onSecondaryContainer); }
.tabs span.on::after { display: none; }
.progress { height: 8px; border-radius: 4px; background: var(--surfaceContainerHighest); }
.progress i { border-radius: 4px; }
.table { border-spacing: 0 3px; font-size: .74rem; }
.table td, .table th { height: 25px; padding: 0 10px; }
.table th { height: 24px; font-size: .7rem; }
.table td { background: var(--surfaceContainerHigh); }
.table td:first-child { border-start-start-radius: 10px; border-end-start-radius: 10px; }
.table td:last-child { border-start-end-radius: 10px; border-end-end-radius: 10px; }

.avatar svg { width: 21px; height: 21px; }
.stepper { gap: 12px; }
.step { border-radius: 24px; padding: 14px; background: var(--surfaceContainer); }
.step.now { outline: none; background: var(--selected); }
.step .num { width: 30px; height: 30px; border-radius: 15px; }
.term { border-radius: 24px; background: #1f1f21; }
/* Switch: a neat small pill; on = filled with the knob at the end, off = outlined with a small knob at the start */
.switch { width: 44px; height: 26px; border-radius: 13px; background: var(--primary); border: none; box-sizing: border-box; }
.switch::after { top: 3px; inset-inline-end: 3px; inset-inline-start: auto; width: 20px; height: 20px; background: var(--onPrimary); }
.switch.off { background: transparent; border: 2px solid var(--outline); }
.switch.off::after { top: 4px; inset-inline-start: 4px; inset-inline-end: auto; width: 14px; height: 14px; background: var(--outline); }
.field { height: 46px; border-radius: 16px; border-color: var(--outline); }
.field.filled-f { border: none; border-radius: 16px; background: var(--surfaceContainerHigh); }
.drop { border-radius: 28px; border-color: var(--outline); }
.drop .avatar { width: 64px; height: 64px; }
.setrow { padding: 6px 0; border-bottom: none; gap: 12px; }
.bar { border-radius: 12px; height: 30px; gap: 3px; }
.linkrow { padding: 11px 10px; border-radius: 20px; margin-bottom: 4px; background: var(--surfaceContainerHigh); }
.linkrow .ic { width: 40px; height: 40px; border-radius: 20px; }
/* About hero: a blue tile with the app icon on a scalloped "cookie" */
.hero { border-radius: 32px; padding: 26px 28px; background: var(--primaryContainer); color: var(--onPrimaryContainer); }
.hero::after { display: none; }

.hero .chip { border-color: color-mix(in srgb, var(--onPrimaryContainer) 40%, transparent); }
.hero .btn.filled, .hero .filled { background: var(--primary); color: var(--onPrimary); }
/* IFOKNR's mark and name keep the brand violet whatever the page colours */
.sigmark { width: 56px; height: 56px; border-radius: 17px; background: linear-gradient(135deg, #483f77, #2a2346); box-shadow: 0 8px 22px rgba(0,0,0,.35), inset 0 0 0 1px rgba(202,190,255,.35); }
.sigmark span { background: linear-gradient(135deg, #f3eeff, #cabeff 55%, #edb8cc); -webkit-background-clip: text; }
.signame { background: linear-gradient(100deg, #f3eeff, #cabeff 50%, #edb8cc); -webkit-background-clip: text; }

/* Compact stats: a slim tonal strip, label then value on one line */
.stat { flex: 1; flex-direction: row; align-items: center; justify-content: space-between; gap: 6px; padding: 7px 11px; border-radius: 12px; min-height: 0; }
.stat small { order: 0; font-size: .7rem; opacity: .8; }
.stat b { order: 1; font-size: .86rem !important; font-weight: 600; margin: 0; line-height: 1.3; }
.stat { position: relative; }
.stat .progress { position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; margin: 0; background: rgba(255,255,255,.16); }
.stat:has(.progress) { padding-bottom: 10px; }
.stat { min-width: 0; overflow: hidden; }
.stat b, .stat small { flex: none; }
.row2:has(> .stat) { gap: 8px; }
/* The phone's own card: slimmer */
.card.low[style*="display:flex"] { padding: 9px 14px; border-radius: 20px; }
.card.low[style*="display:flex"] .avatar { width: 36px; height: 36px; }
.card.low[style*="display:flex"] .avatar svg { width: 17px; height: 17px; }
.card.low[style*="display:flex"] > div > div:first-child { font-size: .84rem !important; }
.card.low[style*="display:flex"] .chip { height: 24px; font-size: .7rem; }
