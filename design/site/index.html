<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IFOKNR Tools</title>
  <link rel="icon" href="img/ifoknr-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <aside class="rail" id="rail" aria-label="Menu">
      <a class="brand" href="#home"><img class="mark" src="img/ifoknr-mark.svg" alt=""><span class="brand-name"><img class="sig sig-dark" src="img/ifoknr-dark.svg" alt="IFOKNR"><img class="sig sig-light" src="img/ifoknr-light.svg" alt="IFOKNR"></span></a>
      <nav class="menu" id="menu"></nav>
      <div class="rail-foot">
        <button class="pill-btn tonal small" data-act="lang"></button>
        <button class="icon-btn" data-act="theme" aria-label="Theme"><svg viewBox="0 0 24 24"><path d="M20 14.2A8 8 0 0 1 9.8 4a8 8 0 1 0 10.2 10.2z"/></svg></button>
      </div>
    </aside>

    <header class="appbar">
      <a class="brand" href="#home"><img class="mark" src="img/ifoknr-mark.svg" alt=""><span class="brand-name"><img class="sig sig-dark" src="img/ifoknr-dark.svg" alt="IFOKNR"><img class="sig sig-light" src="img/ifoknr-light.svg" alt="IFOKNR"></span></a>
      <div class="appbar-actions">
        <button class="icon-btn" data-act="theme" aria-label="Theme"><svg viewBox="0 0 24 24"><path d="M20 14.2A8 8 0 0 1 9.8 4a8 8 0 1 0 10.2 10.2z"/></svg></button>
        <button class="icon-btn" data-act="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
    </header>

    <main id="page"></main>
  </div>

  <div class="scrim" id="scrim" data-act="close"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Menu"><div class="grab"></div><nav class="menu" id="menu-sheet"></nav><div class="sheet-foot"><button class="pill-btn tonal" data-act="lang"></button></div></div>

  <script src="app.js"></script>
</body>
</html>
