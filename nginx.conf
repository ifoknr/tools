# GitHub's release data, fetched by this server and shared by every visitor: GitHub allows 60
# requests an hour per address, which phone networks (many people behind one address) used up,
# leaving the site without versions. Kept 10 minutes, and served stale when GitHub refuses.
proxy_cache_path /var/cache/nginx/github levels=1 keys_zone=github:1m max_size=20m inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # add_header in a location replaces the server's, so each location includes them all.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # The tools library, a Telegram Mini App. live/ is the bot's list of the owner's files
    # (mounted from the bot's data folder; missing means none).
    location /app/ {
        include /etc/nginx/app-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /app/live/private.json {
        include /etc/nginx/app-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Only that one file of the mounted folder.
    location /app/live/ {
        return 404;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Only the releases of ifoknr's own repositories: not an open door to GitHub.
    location ~ ^/gh/repos/ifoknr/(?<repo>[A-Za-z0-9._-]+)/releases$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Cache $upstream_cache_status always;

        # A name in a variable is looked up when asked, so nginx starts even while the phone
        # has no network yet.
        resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
        resolver_timeout 5s;
        set $github api.github.com;
        proxy_pass https://$github/repos/ifoknr/$repo/releases?per_page=100;
        proxy_ssl_server_name on;
        proxy_ssl_name api.github.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host api.github.com;
        proxy_set_header Accept "application/vnd.github+json";
        proxy_set_header User-Agent "ifoknr-tools-site";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;

        proxy_cache github;
        proxy_cache_key $repo;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating invalid_header http_403 http_429 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Vary;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Cache-Control;
    }
}
